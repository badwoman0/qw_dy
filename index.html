<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>甜❤️</title>
  <style>
    body {
      margin: 0;
      font-family: Helvetica Neue, Helvetica, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif;
      font-size: 85%;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow: hidden; /* 避免视频溢出时出现滚动条 */
    }

    /* 背景视频 */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* 像背景图一样填满 */
      z-index: -1;       /* 保证在文字下面 */
    }

    h2 {
      font-size: 220%;
      font-weight: 400;
    }

    .content {
      position: absolute;
      width: 100%;
      top: 40%;
      transform: translateY(-50%);
      text-align: center;
      color: #fff; /* 白色字体，和视频背景区分 */
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .timer {
      font-size: 180%;
      line-height: 1.5;
      margin: 1em 0;
    }

    .timer b {
      color: rgb(253, 99, 125);
    }
  </style>
</head>

<body>
  <!-- 背景视频 -->
  <video autoplay loop muted playsinline id="bg-video">
    <source src="dy.mp4" type="video/mp4">
    你的浏览器不支持视频背景
  </video>

  <div class="content">
    <h2>倾玮 ❤️ 董莹，已经在一起了</h2>
    <div class="timer">
      <b id="d"></b> Days <b id="h"></b> Hours <b id="m"></b> Minutes <b id="s"></b> Seconds
    </div>
  </div>

  <script>
    function timer() {
      var start = new Date("2025-08-15 00:00:00");
      setInterval(() => {
        var t = new Date().getTime() - start;
        var d = Math.floor(t / 1000 / 60 / 60 / 24);
        var h = String(Math.floor(t / 1000 / 60 / 60 % 24)).padStart(2, '0');
        var m = String(Math.floor(t / 1000 / 60 % 60)).padStart(2, '0');
        var s = String(Math.floor(t / 1000 % 60)).padStart(2, '0');
        document.getElementById('d').textContent = d;
        document.getElementById('h').textContent = h;
        document.getElementById('m').textContent = m;
        document.getElementById('s').textContent = s;
      }, 1000);
    }
    timer();
  </script>
</body>

</html>
